<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>.NET deployment demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3f8;color:#172c43;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:32px}article{background:white;padding:32px;border:1px solid #d6e0eb;border-radius:20px;box-shadow:0 12px 40px #17334e08}small{color:#526a82;letter-spacing:.12em}h1{font-size:clamp(28px,5vw,42px);line-height:1.2}h2{font-size:20px}dl{display:grid;grid-template-columns:100px 1fr;gap:12px}dt{color:#526a82}dd{margin:0;overflow-wrap:anywhere}button{background:#183751;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer}a{color:#183751}#status{color:#315b4a}button:focus-visible{outline:3px solid #5298df;outline-offset:3px}@media(max-width:500px){main{padding:16px}article{padding:22px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}}
</style></head><body><main><small>LEARN · BUILD · DEPLOY</small><h1>My first .NET server.</h1><article><p id="status" role="status">Connecting to the application…</p><h2 id="message">Deployment demo</h2><dl><dt>Version</dt><dd id="version">—</dd><dt>Server OS</dt><dd id="os">—</dd><dt>Runtime</dt><dd id="framework">—</dd></dl><button id="refresh">Check again</button> <a href="/health">Health check</a></article><p>Edit the message and version in <code>Program.cs</code>, publish again, then check this page. The server OS confirms where the application is running.</p></main><script>
async function refresh(){const status=document.querySelector('#status');try{const response=await fetch('/api/info',{cache:'no-store'});if(!response.ok)throw Error();const info=await response.json();for(const key of ['message','version','os','framework'])document.getElementById(key).textContent=info[key];status.textContent='Connected · application is running';}catch{status.textContent='Cannot reach the server. Start the application and try again.'}}
document.querySelector('#refresh').onclick=refresh;refresh();
</script></body></html>
